<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GTA Radar">
    <title>GTA Radar (Categories & Mosques)</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; background-color: #050505; overflow: hidden; font-family: sans-serif; }
        #map { height: 100%; width: 100%; }

        /* Sinematik Kenar Karartması */
        body::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            box-shadow: inset 0 0 120px rgba(0,0,0,1);
            pointer-events: none; 
            z-index: 1000;
        }
        
        /* Harita Zemini Filtresi (Grayscale %75) */
        .leaflet-tile-pane {
            filter: grayscale(75%) invert(100%) sepia(10%) hue-rotate(180deg) brightness(85%) contrast(140%);
        }

        /* İdari ve deniz sınır çizgilerini gizle */
        .leaflet-overlay-pane path { stroke: none !important; }
        .leaflet-tile { border: none !important; outline: none !important; }

        /* Zoom Seviyesine Göre Yazı Yoğunluğu Yönetimi */
        .zoom-far .leaflet-tile-pane { filter: grayscale(75%) invert(100%) sepia(10%) hue-rotate(180deg) brightness(65%) contrast(160%) saturate(20%); }
        
        /* 3D Görünümlü Araç İkonu */
        .car-marker {
            width: 0; 
            height: 0; 
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-bottom: 32px solid #ffffff;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.9));
            transition: transform 0.1s linear;
            transform-origin: 50% 50%;
        }

        /* Üst Arama Kutusu */
        .search-wrapper {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1001; 
            width: 70%;
            max-width: 400px;
        }

        #search-box {
            width: 100%;
            padding: 14px 18px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #333;
            color: #fff;
            font-size: 16px;
            border-radius: 8px;
            outline: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.9);
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        #search-box:focus { border-color: #7b00b3; }
        #search-box::placeholder { color: #888; }

        #suggestions {
            background: rgba(15, 15, 15, 0.95);
            border-radius: 8px;
            margin-top: 8px;
            max-height: 250px;
            overflow-y: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.9);
            backdrop-filter: blur(5px);
            display: none;
            z-index: 1002;
            position: relative;
        }

        .suggestion-item {
            padding: 12px 18px;
            color: #ddd;
            border-bottom: 1px solid #333;
            cursor: pointer;
            font-size: 14px;
        }
        .suggestion-item:hover { background: #222; color: #fff; }

        /* --- SAĞ ÜST OYUN MENÜSÜ VE KATEGORİLER --- */
        .menu-container {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1001;
        }

        #menu-btn {
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #333;
            color: #fff;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.9);
            outline: none;
            transition: border-color 0.3s;
        }
        #menu-btn:hover { border-color: #7b00b3; }

        #category-dropdown {
            position: absolute;
            right: 0;
            top: 60px;
            width: 260px;
            background: rgba(10, 10, 10, 0.95);
            border: 2px solid #333;
            border-radius: 8px;
            display: none;
            box-shadow: 0 6px 20px rgba(0,0,0,0.9);
            backdrop-filter: blur(5px);
            overflow: hidden;
        }

        .category-item {
            padding: 14px 18px;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
            border-bottom: 1px solid #222;
            transition: background 0.2s;
        }
        .category-item:hover { background: #7b00b3; }

        /* --- BULUNAN YERLER LİSTESİ (SOL VEYA ORTADA OYUN MENÜSÜ) --- */
        #results-panel {
            position: absolute;
            top: 90px;
            right: 20px;
            width: 300px;
            max-height: 60vh;
            background: rgba(10, 10, 10, 0.95);
            border: 2px solid #333;
            border-radius: 8px;
            display: none;
            z-index: 1001;
            overflow-y: auto;
            box-shadow: 0 6px 20px rgba(0,0,0,0.9);
            backdrop-filter: blur(5px);
        }

        .result-header {
            padding: 12px 18px;
            background: #1a1a1a;
            color: #b300ff;
            font-weight: bold;
            font-size: 14px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-close { cursor: pointer; color: #aaa; font-size: 16px; }
        .result-close:hover { color: #fff; }

        .result-item {
            padding: 12px 18px;
            color: #ddd;
            border-bottom: 1px solid #222;
            cursor: pointer;
            font-size: 13px;
        }
        .result-item:hover { background: #222; color: #fff; }

        /* Sol Alt Şeffaf Pusula */
        .compass-container {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 60px;
            height: 60px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            z-index: 1001;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
        }

        .compass-needle {
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 22px solid #ff3b30; 
            position: relative;
            top: -4px;
            transition: transform 0.08s linear;
            filter: drop-shadow(0 0 2px rgba(0,0,0,0.8));
        }
        
        .compass-needle::after {
            content: '';
            position: absolute;
            top: 22px;
            left: -8px;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 22px solid #ffffff; 
        }
    </style>
</head>
<body>
    <!-- Üst Arama Kutusu -->
    <div class="search-wrapper">
        <input type="text" id="search-box" placeholder="Gitmek İstediğiniz Adresi Yazın">
        <div id="suggestions"></div>
    </div>

    <!-- Sağ Üst Kategoriler / Menü -->
    <div class="menu-container">
        <button id="menu-btn">Kategoriler ▾</button>
        <div id="category-dropdown">
            <div class="category-item" onclick="findNearbyMosques()">🕌 Camiler (2km Çevrede)</div>
            <!-- İleride buraya başka kategoriler ekleyebiliriz -->
        </div>
    </div>

    <!-- Bulunan Yerler Sonuç Paneli -->
    <div id="results-panel">
        <div class="result-header">
            <span id="panel-title">Yakındaki Yerler</span>
            <span class="result-close" onclick="closeResultsPanel()">✕</span>
        </div>
        <div id="results-list"></div>
    </div>

    <div class="compass-container">
        <div class="compass-needle" id="compass"></div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let currentLat = 37.87;
        let currentLng = 32.48;
        let destLat = null;
        let destLng = null;
        let routeLine = null; 
        let searchTimeout = null;
        let userInteracting = false; 
        let interactionTimer = null;
        let lastRerouteTime = 0;
        let amenityMarkers = []; // Haritadaki geçici konum pinleri

        const map = L.map('map', {
            zoomControl: false,
            attributionControl: false 
        }).setView([currentLat, currentLng], 17);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        const carIcon = L.divIcon({
            html: '<div class="car-marker" id="car"></div>',
            className: '',
            iconSize: [28, 32],
            iconAnchor: [14, 16]
        });

        const carMarker = L.marker([currentLat, currentLng], { icon: carIcon }).addTo(map);

        // Menü Açma / Kapatma
        const menuBtn = document.getElementById('menu-btn');
        const categoryDropdown = document.getElementById('category-dropdown');

        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            categoryDropdown.style.display = categoryDropdown.style.display === 'block' ? 'none' : 'block';
        });

        window.addEventListener('click', () => {
            categoryDropdown.style.display = 'none';
        });

        function closeResultsPanel() {
            document.getElementById('results-panel').style.display = 'none';
        }

        // --- 2 KM ÇEVREDEKİ CAMİLERİ BULMA MOTORU (Overpass API) ---
        async function findNearbyMosques() {
            categoryDropdown.style.display = 'none';
            const panel = document.getElementById('results-panel');
            const list = document.getElementById('results-list');
            document.getElementById('panel-title').innerText = "2km Çevredeki Camiler";
            list.innerHTML = '<div class="result-item">Taranıyor...</div>';
            panel.style.display = 'block';

            // Haritadaki önceki geçici pinleri temizle
            amenityMarkers.forEach(m => map.removeLayer(m));
            amenityMarkers = [];

            try {
                // OpenStreetMap Overpass API ile 2000 metre (2km) yarıçapındaki camileri sorgula
                const radius = 2000;
                const query = `[out:json];node["amenity"="place_of_worship"]["religion"="muslim"](around:${radius},${currentLat},${currentLng});out;`;
                const url = `https://overpass-api.de/api/interpreter?data=` + encodeURIComponent(query);

                const res = await fetch(url);
                const data = await res.json();

                list.innerHTML = '';

                if (!data.elements || data.elements.length === 0) {
                    list.innerHTML = '<div class="result-item">Yakında cami bulunamadı.</div>';
                    return;
                }

                data.elements.forEach(mosque => {
                    const mLat = mosque.lat;
                    const mLon = mosque.lon;
                    const mName = mosque.tags.name || "İsimsiz Cami";

                    const item = document.createElement('div');
                    item.className = 'result-item';
                    item.innerText = mName;

                    // Listeden bir camiye tıklandığında
                    item.onclick = function() {
                        destLat = mLat;
                        destLng = mLon;
                        panel.style.display = 'none';
                        updateRoute(true); // Mor yolu çiz
                    };
                    list.appendChild(item);

                    // Haritaya küçük geçici işaretçiler koy
                    const marker = L.marker([mLat, mLon]).addTo(map);
                    marker.bindPopup(`<b>${mName}</b><br><button onclick="selectMosque(${mLat}, ${mLon})">Rotayı Aç</button>`);
                    amenityMarkers.push(marker);
                });

            } catch (err) {
                console.error("Cami arama hatası:", err);
                list.innerHTML = '<div class="result-item">Bağlantı hatası oluştu.</div>';
            }
        }

        // Harita üzerindeki popup içinden rota seçme yardımcısı
        window.selectMosque = function(lat, lng) {
            destLat = lat;
            destLng = lng;
            document.getElementById('results-panel').style.display = 'none';
            updateRoute(true);
        }

        // Zoom Seviyesi Kontrolü
        function checkZoomLevel() {
            const currentZoom = map.getZoom();
            if (currentZoom < 15) {
                document.body.classList.add('zoom-far');
            } else {
                document.body.classList.remove('zoom-far');
            }
        }
        map.on('zoomend', checkZoomLevel);
        checkZoomLevel();

        map.on('movestart', function() {
            userInteracting = true;
            clearTimeout(interactionTimer);
        });

        // Anlık Yön ve Pusula
        window.addEventListener('deviceorientation', function(e) {
            let heading = e.alpha; 
            if (heading !== null && !isNaN(heading)) {
                if (e.webkitCompassHeading) { heading = e.webkitCompassHeading; }
                
                const carDiv = document.getElementById('car');
                if (carDiv) { carDiv.style.transform = `rotate(${heading}deg)`; }

                const compassDiv = document.getElementById('compass');
                if (compassDiv) { compassDiv.style.transform = `rotate(${-heading}deg)`; }
            }
        }, true);

        // Anlık GPS ve Rota Güncelleme
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                function(position) {
                    currentLat = position.coords.latitude;
                    currentLng = position.coords.longitude;
                    
                    carMarker.setLatLng([currentLat, currentLng]);
                    
                    if (!userInteracting && !routeLine) {
                        map.panTo([currentLat, currentLng], { animate: true });
                    }

                    const now = Date.now();
                    if (destLat !== null && destLng !== null && (now - lastRerouteTime > 5000)) {
                        lastRerouteTime = now;
                        updateRoute(false);
                    }
                },
                function(error) { console.warn("GPS Bekleniyor..."); },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
            );
        }

        map.on('dragend', function() {
            clearTimeout(interactionTimer);
            interactionTimer = setTimeout(() => {
                userInteracting = false;
            }, 60000);
        });

        // Adres Arama Motoru
        const searchBox = document.getElementById('search-box');
        const suggestionsBox = document.getElementById('suggestions');

        searchBox.addEventListener('input', function() {
            clearTimeout(searchTimeout);
            const query = this.value;

            if (query.length < 3) {
                suggestionsBox.style.display = 'none';
                return;
            }

            searchTimeout = setTimeout(async () => {
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=6&countrycodes=tr&q=${encodeURIComponent(query)}`);
                    const data = await res.json();

                    suggestionsBox.innerHTML = '';

                    if (data.length > 0) {
                        suggestionsBox.style.display = 'block';
                        data.forEach(item => {
                            const div = document.createElement('div');
                            div.className = 'suggestion-item';
                            div.innerText = item.display_name; 
                            
                            div.onclick = function() {
                                searchBox.value = item.display_name.split(',')[0];
                                suggestionsBox.style.display = 'none';
                                searchBox.blur();
                                userInteracting = false;
                                
                                destLat = parseFloat(item.lat);
                                destLng = parseFloat(item.lon);
                                updateRoute(true);
                            };
                            suggestionsBox.appendChild(div);
                        });
                    } else {
                        suggestionsBox.style.display = 'none';
                    }
                } catch (err) {
                    console.error("Arama hatası", err);
                }
            }, 500);
        });

        // Kesin Çalışan Rota Çizme Fonksiyonu
        async function updateRoute(fitBounds = false) {
            if (destLat === null || destLng === null) return;

            try {
                const url = `https://router.project-osrm.org/route/v1/driving/${currentLng},${currentLat};${destLng},${destLat}?overview=full&geometries=geojson`;
                const routeRes = await fetch(url);
                const routeData = await routeRes.json();

                if (!routeData.routes || routeData.routes.length === 0) return;

                const routeGeoJSON = routeData.routes[0].geometry;

                if (routeLine) { map.removeLayer(routeLine); }

                routeLine = L.geoJSON(routeGeoJSON, {
                    style: {
                        color: '#7b00b3', 
                        weight: 10,       
                        opacity: 0.95,
                        lineCap: 'round', 
                        lineJoin: 'round' 
                    }
                }).addTo(map);

                if (fitBounds) {
                    map.fitBounds(routeLine.getBounds(), { padding: [60, 60] });
                }

            } catch (err) {
                console.error("Rota güncelleme hatası:", err);
            }
        }
    </script>
</body>
</html>
