<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <!-- iOS Araç Ekranı Ayarları -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GTA Radar">
    <title>GTA Radar (Free Dark)</title>
    
    <!-- Ücretsiz Harita Kütüphanesi -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* Haritayı tam ekran yap */
        html, body, #map { height: 100%; width: 100%; margin: 0; padding: 0; background-color: #111; overflow: hidden; }
        
        /* İŞTE SİHİRLİ KOD: Standart haritayı Gece Moduna çevirir */
        .leaflet-tile-pane {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(105%);
        }
        
        /* Araba İkonu Tasarımı (Beyaz Ok) */
        .car-marker {
            width: 0; 
            height: 0; 
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 28px solid #ffffff;
            filter: drop-shadow(0px 0px 4px #000000);
            transition: transform 0.2s linear;
            transform-origin: 50% 50%;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Haritayı başlat
        const map = L.map('map', {
            zoomControl: false 
        }).setView([37.87, 32.48], 17); // Konya Merkez

        // Tamamen ücretsiz, API gerektirmeyen standart OpenStreetMap (CSS ile karartıldı)
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: ''
        }).addTo(map);

        // Araba İkonunu Ekle
        const carIcon = L.divIcon({
            html: '<div class="car-marker" id="car"></div>',
            className: '',
            iconSize: [24, 28],
            iconAnchor: [12, 14]
        });

        const carMarker = L.marker([37.87, 32.48], { icon: carIcon }).addTo(map);

        // GPS Takibi (PC'de sabit durabilir, iPad'de hareket eder)
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const heading = position.coords.heading;

                    carMarker.setLatLng([lat, lng]);
                    map.panTo([lat, lng], { animate: true });

                    if (heading !== null && !isNaN(heading)) {
                        const carDiv = document.getElementById('car');
                        if (carDiv) {
                            carDiv.style.transform = `rotate(${heading}deg)`;
                        }
                    }
                },
                function(error) {
                    console.warn("GPS Bekleniyor...");
                },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
            );
        }
    </script>
</body>
</html>
