<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <!-- iOS Araç Ekranı Ayarları -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GTA Radar">
    <title>GTA Radar (Free)</title>
    
    <!-- Ücretsiz Harita Kütüphanesi (Leaflet CSS) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* Haritayı tam ekran yap */
        html, body, #map { height: 100%; width: 100%; margin: 0; padding: 0; background-color: #000; overflow: hidden; }
        
        /* Araba İkonu Tasarımı (Beyaz GTA Oku) */
        .car-marker {
            width: 0; 
            height: 0; 
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 28px solid #ffffff;
            filter: drop-shadow(0px 0px 4px #000000);
            transition: transform 0.2s linear; /* Dönüşlerin yumuşak olması için */
            transform-origin: 50% 50%;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- Ücretsiz Harita Kütüphanesi (Leaflet JS) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Haritayı Konya merkezli başlat (Google butonları olmadan temiz ekran)
        const map = L.map('map', {
            zoomControl: false 
        }).setView([37.87, 32.48], 17);

        // API Kodu Gerektirmeyen Tamamen Siyah Harita Katmanı
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '', // Alt yazıları gizlemek istersen burayı boş bırakabilirsin
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // Araba İkonunu Haritaya Ekle
        const carIcon = L.divIcon({
            html: '<div class="car-marker" id="car"></div>',
            className: '', // Varsayılan beyaz kutuyu kaldır
            iconSize: [24, 28],
            iconAnchor: [12, 14] // İkonun tam ortası merkez olsun
        });

        const carMarker = L.marker([37.87, 32.48], { icon: carIcon }).addTo(map);

        // iOS Safari Üzerinden Anlık GPS Takibi
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const heading = position.coords.heading;

                    // İkonun ve haritanın konumunu kaydır
                    carMarker.setLatLng([lat, lng]);
                    map.panTo([lat, lng], { animate: true });

                    // iPad/iPhone'dan yön (pusula) verisi geliyorsa oku döndür
                    if (heading !== null && !isNaN(heading)) {
                        const carDiv = document.getElementById('car');
                        if (carDiv) {
                            carDiv.style.transform = `rotate(${heading}deg)`;
                        }
                    }
                },
                function(error) {
                    console.warn("GPS Hatası: Cihaz konum bulamıyor.");
                },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
            );
        }
    </script>
</body>
</html>
