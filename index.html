<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GTA Radar">
    <title>GTA Radar (Routing)</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; background-color: #050505; overflow: hidden; font-family: sans-serif; }
        #map { height: 100%; width: 100%; }

        /* Sinematik Kenar Karartması */
        body::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            box-shadow: inset 0 0 120px rgba(0,0,0,1);
            pointer-events: none; 
            z-index: 1000;
        }
        
        /* Harita Zemini Filtresi (Çizgiyi etkilemez) */
        .leaflet-tile-pane {
            filter: grayscale(850%) invert(100%) sepia(10%) hue-rotate(180deg) brightness(85%) contrast(140%);
        }
        
        /* 3D Görünümlü Araç İkonu */
        .car-marker {
            width: 0; 
            height: 0; 
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-bottom: 32px solid #ffffff;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.9));
            transition: transform 0.15s linear;
            transform-origin: 50% 50%;
        }

        /* GTA Stili Arama Kutusu (HUD) */
        .search-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1001; /* Haritanın en üstünde dursun */
            width: 80%;
            max-width: 400px;
        }

        #search-box {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.75);
            border: 2px solid #333;
            color: #fff;
            font-size: 16px;
            border-radius: 8px;
            outline: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            transition: border-color 0.3s;
        }

        #search-box::placeholder {
            color: #888;
        }
        
        /* Kutuya tıklanınca kenarı mor parlasın */
        #search-box:focus {
            border-color: #b300ff; 
        }
    </style>
</head>
<body>
    <!-- Arama Kutusu -->
    <div class="search-container">
        <input type="text" id="search-box" placeholder="Nereye gidiyoruz? (Örn: Kent Plaza Konya)">
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let currentLat = 37.87;
        let currentLng = 32.48;
        let routeLine = null; // Çizilen rotayı hafızada tutmak için

        const map = L.map('map', {
            zoomControl: false,
            attributionControl: false 
        }).setView([currentLat, currentLng], 17);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19
        }).addTo(map);

        const carIcon = L.divIcon({
            html: '<div class="car-marker" id="car"></div>',
            className: '',
            iconSize: [28, 32],
            iconAnchor: [14, 16]
        });

        const carMarker = L.marker([currentLat, currentLng], { icon: carIcon }).addTo(map);

        // Anlık Konum Takibi
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                function(position) {
                    currentLat = position.coords.latitude;
                    currentLng = position.coords.longitude;
                    const heading = position.coords.heading;

                    carMarker.setLatLng([currentLat, currentLng]);
                    
                    // Eğer ekranda bir rota çizgisi yoksa, kamera arabayı takip etsin
                    // (Rota varken harita uzaklaşacağı için kamerayı kilitlemiyoruz)
                    if (!routeLine) {
                        map.panTo([currentLat, currentLng], { animate: true });
                    }

                    if (heading !== null && !isNaN(heading)) {
                        const carDiv = document.getElementById('car');
                        if (carDiv) {
                            carDiv.style.transform = `rotate(${heading}deg)`;
                        }
                    }
                },
                function(error) {
                    console.warn("GPS Bekleniyor...");
                },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
            );
        }

        // --- ROTA ÇİZME MOTORU ---
        document.getElementById('search-box').addEventListener('keypress', async function (e) {
            if (e.key === 'Enter') { // Enter'a basıldığında
                const address = this.value;
                if (!address) return;

                // iPad'de klavyeyi ekrandan gizle
                this.blur(); 

                try {
                    // 1. Adresi koordinata çevir (Ücretsiz)
                    const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`);
                    const geoData = await geoRes.json();
                    
                    if (geoData.length === 0) {
                        alert("Adres bulunamadı! Daha net yazmayı dene.");
                        return;
                    }
                    
                    const destLat = geoData[0].lat;
                    const destLng = geoData[0].lon;

                    // 2. Rota koordinatlarını hesapla (Ücretsiz Araç Rotası API)
                    const routeRes = await fetch(`https://router.project-osrm.org/route/v1/driving/${currentLng},currentLat;${destLng},destLat?overview=full&geometries=geojson`.replace('currentLat', currentLat).replace('destLat', destLat));
                    const routeData = await routeRes.json();

                    if (!routeData.routes || routeData.routes.length === 0) {
                        alert("Bu adrese araç rotası çizilemiyor.");
                        return;
                    }

                    const routeGeoJSON = routeData.routes[0].geometry;

                    // Eski rota çizgisi varsa haritadan sil
                    if (routeLine) {
                        map.removeLayer(routeLine);
                    }

                    // 3. Çizgiyi Haritaya Ekle (GTA 5 Waypoint Moru)
                    routeLine = L.geoJSON(routeGeoJSON, {
                        style: {
                            color: '#b300ff', // Parlak neon mor
                            weight: 7,        // Çizgi kalınlığı
                            opacity: 0.9      // Hafif şeffaflık
                        }
                    }).addTo(map);

                    // Kamerayı, çizilen rotanın tamamını görecek şekilde yukarı kaldır (uzaklaştır)
                    map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });

                } catch (err) {
                    console.error(err);
                    alert("Rota hesaplanırken internet hatası oluştu.");
                }
            }
        });
    </script>
</body>
</html>
