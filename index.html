<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GTA Radar">
    <title>GTA Radar (True Dark)</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; background-color: #050505; overflow: hidden; }
        #map { height: 100%; width: 100%; }

        /* Sinematik Kenar Karartması (Vignette) */
        body::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            box-shadow: inset 0 0 120px rgba(0,0,0,1);
            pointer-events: none; 
            z-index: 1000;
        }
        
        /* 
           SİHİRLİ FİLTRE: 
           1. grayscale(100%): Turuncu, yeşil ve mavi tonları tamamen yok eder (Siyah-beyaz yapar).
           2. invert(100%): Beyazı siyaha çevirip gece modunu başlatır.
           3. sepia & hue: Radara çok hafif koyu, mat bir "çelik/asfalt" hissiyatı katar.
           4. brightness & contrast: Parlamaları kısıp tam oyun menüsü havası verir.
        */
        .leaflet-tile-pane {
            filter: grayscale(90%) invert(100%) sepia(10%) hue-rotate(180deg) brightness(85%) contrast(140%);
        }
        
        /* 3D Görünümlü Araç İkonu */
        .car-marker {
            width: 0; 
            height: 0; 
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-bottom: 32px solid #ffffff;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.9));
            transition: transform 0.15s linear;
            transform-origin: 50% 50%;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', {
            zoomControl: false,
            attributionControl: false 
        }).setView([37.87, 32.48], 17);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19
        }).addTo(map);

        const carIcon = L.divIcon({
            html: '<div class="car-marker" id="car"></div>',
            className: '',
            iconSize: [28, 32],
            iconAnchor: [14, 16]
        });

        const carMarker = L.marker([37.87, 32.48], { icon: carIcon }).addTo(map);

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const heading = position.coords.heading;

                    carMarker.setLatLng([lat, lng]);
                    map.panTo([lat, lng], { animate: true });

                    if (heading !== null && !isNaN(heading)) {
                        const carDiv = document.getElementById('car');
                        if (carDiv) {
                            carDiv.style.transform = `rotate(${heading}deg)`;
                        }
                    }
                },
                function(error) {
                    console.warn("GPS Bekleniyor...");
                },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
            );
        }
    </script>
</body>
</html>
